# ============================================
# ManageMyVault — Application Configuration
# ============================================

spring:
  application:
    name: managemyvault

  profiles:
    active: local

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application-specific
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-must-be-changed-in-production-at-least-64-chars-long!!}
    access-token-expiration: 900000      # 15 minutes in ms
    refresh-token-expiration: 604800000  # 7 days in ms
    issuer: managemyvault

  vault:
    master-encryption-key: ${VAULT_MEK:dev-master-encryption-key-32bytes!}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

---
# ============================================
# LOCAL Profile
# ============================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/managemyvault
    username: mmv_admin
    password: mmv_secret_2024
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      password: mmv_redis_2024
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

    elasticsearch:
      repositories:
        enabled: false

  elasticsearch:
    uris: http://localhost:9200

  jpa:
    show-sql: true

app:
  minio:
    endpoint: http://localhost:9000
    access-key: mmv_minio_admin
    secret-key: mmv_minio_secret_2024
    bucket-name: managemyvault

logging:
  level:
    com.managemyvault: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ============================================
# STAGING Profile
# ============================================
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

app:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:managemyvault-staging}

logging:
  level:
    com.managemyvault: INFO
    org.springframework.security: WARN

---
# ============================================
# PRODUCTION Profile
# ============================================
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  jpa:
    properties:
      hibernate:
        generate_statistics: false

app:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:managemyvault}

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.managemyvault: WARN
    org.springframework.security: ERROR
    org.hibernate.SQL: ERROR
