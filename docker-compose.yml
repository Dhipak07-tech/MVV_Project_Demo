version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mmv-postgres
    environment:
      POSTGRES_DB: managemyvault
      POSTGRES_USER: mmv_admin
      POSTGRES_PASSWORD: mmv_secret_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - mmv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmv_admin -d managemyvault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmv-network

  redis:
    image: redis:7-alpine
    container_name: mmv-redis
    command: redis-server --requirepass mmv_redis_2024 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - mmv_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mmv_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmv-network

  minio:
    image: minio/minio:latest
    container_name: mmv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mmv_minio_admin
      MINIO_ROOT_PASSWORD: mmv_minio_secret_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mmv_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mmv-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: mmv-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=mmv-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - mmv_elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mmv-network

volumes:
  mmv_postgres_data:
    driver: local
  mmv_redis_data:
    driver: local
  mmv_minio_data:
    driver: local
  mmv_elastic_data:
    driver: local

networks:
  mmv-network:
    driver: bridge
